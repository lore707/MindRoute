name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      # Contratto temporale dei momenti: nessun valore ignoto deve far fallire
      # un giorno, e gli orari mostrati devono essere coerenti. E' logica pura,
      # non serve DB.
      - name: Verify moment time contract
        run: npm run verify:times

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          ANTHROPIC_API_KEY: placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          SESSION_SECRET: ci_placeholder_secret_not_for_production
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
          GOOGLE_CALLBACK_URL: http://localhost:5000/auth/google/callback
